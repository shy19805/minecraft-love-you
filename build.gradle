plugins {
    id "net.fabricmc.fabric-loom" version "1.17.1"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// ---------------------------------------------------------------------------
// 多版本基线（26.1.2 / 26.2）
// 默认 26.1.2 = 兼容下限：编译器强制只用两版都存在的 API，产出的 jar 两版通吃。
// 想在 26.2 上开发/运行：./gradlew runClient -Pmc=26.2
// ---------------------------------------------------------------------------
def MC_BASELINES = [
        "26.1.2": [
                loader : "0.19.3",
                fabric : "0.155.2+26.1.2",
                modmenu: "18.0.0",
                cloth  : "26.1.154+fabric",
                sodium : "mc26.1.2-0.9.2-fabric",
        ],
        "26.2"  : [
                loader : "0.19.3",
                fabric : "0.155.2+26.2",
                modmenu: "20.0.1",
                cloth  : "26.2.155+fabric",
                sodium : "mc26.2-0.9.1-fabric",
        ],
]

def mcVersion = (project.findProperty("mc") ?: "26.1.2").toString()
def mc = MC_BASELINES[mcVersion]
if (mc == null) {
    throw new GradleException("未知的 mc 基线 '${mcVersion}'，可选：${MC_BASELINES.keySet()}")
}
logger.lifecycle("构建基线 Minecraft = ${mcVersion}（兼容范围 26.1.2 ~ 26.2）")

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    implementation "net.fabricmc:fabric-loader:${mc.loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${mc.fabric}"
    implementation "com.terraformersmc:modmenu:${mc.modmenu}"
    implementation "maven.modrinth:cloth-config:${mc.cloth}"
    compileOnly "maven.modrinth:sodium:${mc.sodium}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
    withSourcesJar()
}
